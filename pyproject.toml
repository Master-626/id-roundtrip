[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "id-roundtrip"
version = "0.1.1"
description = "Exact, local identifier preservation checks for CSV round trips"
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
[project.scripts]
id-roundtrip = "id_roundtrip.__main__:main"
[tool.setuptools.packages.find]
where = ["src"]
