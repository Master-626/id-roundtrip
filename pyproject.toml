[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "id-roundtrip"
version = "0.1.2"
description = "Exact, local identifier preservation checks for CSV round trips"
requires-python = ">=3.10"
# SPDX `license = "MIT"` needs setuptools>=77 plus packaging>=24.2.
# The table form still builds on the declared setuptools>=68 floor.
license = {text = "MIT"}
readme = "README.md"

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8", "setuptools>=68"]

[project.scripts]
id-roundtrip = "id_roundtrip.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Explicit selection: newer ruff releases add preview-style rules to the
# implicit default. Stay on pyflakes plus pycodestyle errors.
select = ["E4", "E7", "E9", "F"]
# Existing unittest modules keep a few compact one-line asserts.
ignore = ["E701", "E702"]
